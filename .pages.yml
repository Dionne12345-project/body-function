media:
  input: images
  output: /images
content:
- name: index
  label: Homepage Settings
  type: file
  path: content/index.json
  fields:
  - name: items
    label: Website text and settings
    type: object
    list: true
    fields:
    - name: id
      label: Reference code (leave unchanged)
      type: string
      required: true
    - name: label
      label: Description of this item
      type: string
    - name: value
      label: Edit text or link here
      type: text
