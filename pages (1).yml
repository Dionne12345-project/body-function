  "summary": "When you are recovering from an injury or a long-standing problem, it is natural to want to get back to normal as quickly as possible. But recovery rarely…",
  "body": "When you are recovering from an injury or a long-standing problem, it is natural to want to get back to normal as quickly as possible. But recovery rarely follows a straight line, and the way you build things back up matters as much as how hard you work.\n\n## Why your body needs time to adapt\n\nMuscles, tendons, joints and bones respond to the demands we place on them. When those demands increase steadily, tissues tend to adapt and become more capable. When they jump suddenly, whether that is a first run after weeks off or a full gym session after an injury, the body can struggle to keep up and symptoms often flare.\n\nAt the other extreme, avoiding movement for too long can leave you stiffer, weaker and less confident. Good rehabilitation sits between the two: enough challenge to move you forward, not so much that you take a step back.\n\n## What gradual progression looks like\n\nProgressive loading simply means increasing what you ask of your body in small, planned steps. That might be more repetitions, a little more weight, a longer walk, or a more demanding position. Usually only one thing changes at a time, so you can see what your body is responding to.\n\n- Start at a level you can repeat comfortably, not your best day\n- Change one thing at a time: how much, how often or how hard\n- Notice how you feel during the activity and over the following day\n- Keep a simple note of what you did and how it felt\n\n## Good days, bad days and flare-ups\n\nProgress is rarely smooth. Symptoms can vary with sleep, stress, workload and activity, and a sore day does not automatically mean you have done damage. A sensible response is usually to ease back slightly, keep gently moving, and build up again rather than stopping altogether.\n\nIf your symptoms keep getting worse, or you are unsure how much to do, that is a good moment to have your plan reviewed.\n\n## Confidence is part of recovery\n\nAfter an injury or a long period of pain, many people become cautious about movement. Small, achievable wins rebuild trust in your body. Completing a manageable session, then repeating it, then adding a little more, often does more for confidence than a single big effort.\n\n## Key points\n\n- Recovery is rarely a straight line, and that is normal\n- Small, planned increases usually work better than big jumps\n- A flare-up is a signal to adjust, not necessarily to stop\n\n## When to seek help\n\nSeek advice promptly if you develop new numbness or weakness, severe or worsening pain, pain that wakes you at night, or if you feel generally unwell.\n\nThis article is general information and is not a substitute for an individual assessment or medical advice.\n",
